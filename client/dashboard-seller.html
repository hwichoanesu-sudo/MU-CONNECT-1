<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUCONNECT — Seller Hub</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">MU<span>CONNECT</span></a>
            <div class="nav-actions">
                <a href="index.html" class="btn-secondary">🛒 Marketplace</a>
            </div>
        </div>
    </header>

    <div class="container" style="padding-top: 2rem;">
        <div class="seller-header">
            <h1>Seller Dashboard</h1>
            <p>Manage your campus business, products, and incoming student orders.</p>
        </div>

        <!-- Metrics Overview -->
        <div class="metrics-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 2rem 0;">
            <div class="metric-card" style="background: var(--card-bg); border: 1px solid var(--border-glass); padding: 1.2rem; border-radius: 14px;">
                <small style="color: var(--text-muted);">Total Products</small>
                <h2 id="totalProducts">0</h2>
            </div>
            <div class="metric-card" style="background: var(--card-bg); border: 1px solid var(--border-glass); padding: 1.2rem; border-radius: 14px;">
                <small style="color: var(--text-muted);">Active Orders</small>
                <h2 id="activeOrders">0</h2>
            </div>
            <div class="metric-card" style="background: var(--card-bg); border: 1px solid var(--border-glass); padding: 1.2rem; border-radius: 14px;">
                <small style="color: var(--text-muted);">Platform Commission (5%)</small>
                <h2 id="commissionDue" style="color: var(--accent-emerald);">K0.00</h2>
            </div>
        </div>

        <!-- Storefront Setup / Management Panel -->
        <div class="seller-sections" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem;">
            
            <!-- Register Business / Update Profile -->
            <div class="card-box" style="background: var(--card-bg); border: 1px solid var(--border-glass); padding: 1.5rem; border-radius: 16px;">
                <h3>1. Business Storefront</h3>
                <form id="businessForm" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                    <input type="text" id="bizName" placeholder="Business Name (e.g., Block C Bakes)" required style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                    <select id="bizCategory" required style="padding: 0.8rem; background: #111827; border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                        <option value="Food & Drinks">Food & Drinks</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Services">Services</option>
                    </select>
                    <input type="text" id="bizLocation" placeholder="Campus Location (e.g., Hostel Block C, Room 12)" required style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                    <textarea id="bizDesc" placeholder="Short store description..." style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff; resize: none; height: 80px;"></textarea>
                    <button type="submit" class="btn-primary">Save Business Profile</button>
                </form>
            </div>

            <!-- Add Product -->
            <div class="card-box" style="background: var(--card-bg); border: 1px solid var(--border-glass); padding: 1.5rem; border-radius: 16px;">
                <h3>2. Add New Product</h3>
                <form id="productForm" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                    <input type="text" id="prodName" placeholder="Product Name" required style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                    <input type="number" id="prodPrice" placeholder="Price in Kwacha (ZMW)" step="0.01" required style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                    <input type="number" id="prodStock" placeholder="Available Stock Quantity" required style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                    <input type="url" id="prodImage" placeholder="Product Image URL (e.g., Supabase/Imgur link)" style="padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;">
                    <button type="submit" class="btn-primary">Publish Product Listing</button>
                </form>
            </div>

        </div>
    </div>

    <script src="js/seller.js"></script>
</body>
</html>
